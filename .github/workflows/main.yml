name: Build VMecha AAR
on: 
  workflow_dispatch: # Memungkinkan build manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Workspace Structure
        run: |
          echo "=== Cleaning & Moving files ==="
          # Pindahkan file dari subfolder ke root jika ada
          if [ -d "VirtualApp" ]; then
            cp -r VirtualApp/* .
            cp -r VirtualApp/.[!.]* . 2>/dev/null || true
            rm -rf VirtualApp
          fi
          
          # HAPUS file build lama agar tidak konflik dengan Gradle 9 saat init wrapper
          rm -f build.gradle settings.gradle lib/build.gradle
          
      - name: Create settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
              }
          }
          rootProject.name = "VMechaVM"
          include ':lib'
          EOF

      - name: Create root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.library' version '8.1.0' apply false
          }
          EOF

      - name: Setup Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Patch lib module
        run: |
          # Masuk ke folder lib untuk mulai patching
          cd lib
          
          # Cari path package asli
          OLD_PATH=$(find src/main/java -type d -path "*/com/lody/virtual" | head -1)
          echo "Found source path: $OLD_PATH"
          
          # Replace package name di semua file source (java, kt, xml)
          find src -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" \) -exec sed -i 's/com\.lody\.virtual/com.vmecha.vcore/g' {} +
          
          # Pindahkan folder ke struktur package baru
          if [ ! -z "$OLD_PATH" ]; then
            mkdir -p src/main/java/com/vmecha
            mv "$OLD_PATH" src/main/java/com/vmecha/vcore
          fi
          
          # Buat build.gradle LIB yang modern
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.library'
          }

          android {
              namespace 'com.vmecha.vcore'
              compileSdk 34
              
              defaultConfig {
                  minSdk 21
                  targetSdk 34
                  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.multidex:multidex:2.0.1'
              compileOnly fileTree(dir: 'libs', include: ['*.jar'])
          }
          EOF

      - name: Global Package Rename
        run: |
          # Pastikan semua string com.lody.virtual hilang dari seluruh project (termasuk manifest)
          find . -type f -not -path '*/.*' -exec sed -i 's/com\.lody\.virtual/com.vmecha.vcore/g' {} +

      - name: Build AAR
        run: |
          chmod +x gradlew
          ./gradlew :lib:assembleRelease --stacktrace --no-daemon

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: vmecha-vcore-release
          path: lib/build/outputs/aar/lib-release.aar
          
