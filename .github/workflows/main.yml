name: Build VMecha AAR
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Workspace Structure
        run: |
          if [ -d "VirtualApp" ]; then
            cp -r VirtualApp/* .
            cp -r VirtualApp/.[!.]* . 2>/dev/null || true
            rm -rf VirtualApp
          fi
          rm -f build.gradle settings.gradle lib/build.gradle
          
      - name: Create gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

      - name: Create settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { 
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  // Tambahkan JitPack dan JCenter untuk library lama
                  maven { url "https://jitpack.io" }
                  maven { url "https://jcenter.bintray.com/" }
              }
          }
          rootProject.name = "VMechaVM"
          include ':lib'
          EOF

      - name: Create root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.library' version '8.1.0' apply false
          }
          EOF

      - name: Setup Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Patch lib module
        run: |
          cd lib
          for base in src/main/java src/main/aidl; do
            if [ -d "$base/com/lody/virtual" ]; then
              mkdir -p "$base/com/vmecha"
              mv "$base/com/lody/virtual" "$base/com/vmecha/vcore"
            fi
          done
          
          find src -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.aidl" \) -exec sed -i 's/com\.lody\.virtual/com.vmecha.vcore/g' {} +
          sed -i 's/package="[^"]*"//g' src/main/AndroidManifest.xml

          cat > build.gradle << 'EOF'
          plugins { id 'com.android.library' }
          android {
              namespace 'com.vmecha.vcore'
              compileSdk 34
              buildFeatures { aidl true }
              defaultConfig {
                  minSdk 21
                  targetSdk 34
                  multiDexEnabled true
                  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
              }
              sourceSets {
                  main {
                      java.srcDirs = ['src/main/java']
                      aidl.srcDirs = ['src/main/aidl', 'src/main/java']
                      jniLibs.srcDirs = ['libs']
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint { abortOnError false }
          }
          dependencies {
              implementation 'androidx.multidex:multidex:2.0.1'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.0'
              implementation 'com.google.android.material:material:1.9.0'
              implementation 'androidx.cardview:cardview:1.0.0'
              implementation 'org.jdeferred:jdeferred-android-aar:1.2.4'
              implementation 'com.melnykov:floatingactionbutton:1.3.0'
              implementation 'com.jonathanfinerty.once:once:1.0.3'
              implementation 'com.kyleduo.switchbutton:library:1.4.6'
              compileOnly fileTree(dir: 'libs', include: ['*.jar'])
              implementation fileTree(dir: 'libs', include: ['*.jar'])
          }
          EOF

      - name: Global String Replacement
        run: |
          find . -maxdepth 4 -type f -not -path '*/.*' -exec sed -i 's/com\.lody\.virtual/com.vmecha.vcore/g' {} +

      - name: Build AAR
        run: |
          chmod +x gradlew
          ./gradlew :lib:assembleRelease --stacktrace --no-daemon

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: vmecha-vcore-release
          path: lib/build/outputs/aar/lib-release.aar
