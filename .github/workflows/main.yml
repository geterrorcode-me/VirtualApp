name: Build VMecha AAR
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Prepare Workspace Structure
        run: |
          echo "=== Moving nested files to root ==="
          # Memindahkan isi dari folder VirtualApp ke root agar folder 'lib' ada di ./lib
          if [ -d "VirtualApp" ]; then
            cp -r VirtualApp/* .
            # Pindahkan file tersembunyi jika ada
            cp -r VirtualApp/.[!.]* . 2>/dev/null || true
            rm -rf VirtualApp
          fi
          echo "=== ROOT structure after move ==="
          ls -la
          
      - name: Create settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
              }
          }
          rootProject.name = "VMechaVM"
          include ':lib'
          EOF
          
      - name: Create root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.0' apply false
              id 'com.android.library' version '8.1.0' apply false
          }
          EOF
          
      - name: Setup Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9
        
      - name: Patch lib module
        run: |
          # Sekarang folder lib sudah ada di root
          cd lib
          
          # Mencari path source code asli
          OLD_PATH=$(find src/main/java -type d -path "*/com/lody/virtual" | head -1)
          echo "Found: $OLD_PATH"
          
          if [ -z "$OLD_PATH" ]; then
            echo "Path com/lody/virtual tidak ditemukan! Folder lib mungkin kosong atau struktur salah."
            ls -R src/main/java
            exit 1
          fi
          
          # Patch semua file source
          find src -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" \) -exec sed -i 's/com\.lody\.virtual/com.vmecha.vcore/g' {} +
          
          # Re-structure folder package
          mkdir -p src/main/java/com/vmecha
          mv "$OLD_PATH" src/main/java/com/vmecha/vcore
          
          # Clean up assets & libs
          rm -rf src/main/jniLibs/x86 src/main/jniLibs/x86_64
          rm -f src/main/assets/XposedBridge.jar
          
          # Update build.gradle module lib
          # Kita buat baru saja agar lebih bersih dan kompatibel dengan Gradle 8
          cat > build.gradle << 'EOF'
          plugins { id 'com.android.library' }
          android {
              namespace 'com.vmecha.vcore'
              compileSdk 34
              defaultConfig {
                  minSdk 21
                  targetSdk 34
                  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.multidex:multidex:2.0.1'
          }
          EOF
          
      - name: Patch all imports (Root Level)
        run: |
          # Pastikan semua referensi di project terganti
          find . -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" -o -name "*.gradle" \) -exec sed -i 's/com\.lody\.virtual/com.vmecha.vcore/g' {} +
          
      - name: Build AAR
        run: |
          chmod +x gradlew
          ./gradlew :lib:assembleRelease --stacktrace
          
      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: vmecha-vm-aar
          path: lib/build/outputs/aar/lib-release.aar
          
