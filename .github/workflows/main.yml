name: Build VMecha AAR
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Workspace Structure
        run: |
          if [ -d "VirtualApp" ]; then
            cp -r VirtualApp/* .
            cp -r VirtualApp/.[!.]* . 2>/dev/null || true
            rm -rf VirtualApp
          fi
          rm -f build.gradle settings.gradle lib/build.gradle
          
      - name: Create gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

      - name: Create settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
              }
          }
          rootProject.name = "VMechaVM"
          include ':lib'
          EOF

      - name: Create root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.library' version '8.1.0' apply false
          }
          EOF

      - name: Setup Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Patch lib module
        run: |
          cd lib
          
          # 1. Rename Package di Source Code
          OLD_PATH=$(find src/main/java -type d -path "*/com/lody/virtual" | head -1)
          find src -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" \) -exec sed -i 's/com\.lody\.virtual/com.vmecha.vcore/g' {} +
          
          if [ ! -z "$OLD_PATH" ]; then
            mkdir -p src/main/java/com/vmecha
            mv "$OLD_PATH" src/main/java/com/vmecha/vcore
          fi
          
          # 2. Hapus atribut package dari Manifest (WAJIB untuk Gradle 8+)
          # Ini akan menghapus 'package="com.vmecha.vcore"' atau 'package="com.lody.virtual"'
          sed -i 's/package="[^"]*"//g' src/main/AndroidManifest.xml

          # 3. Buat build.gradle LIB
          cat > build.gradle << 'EOF'
          plugins { id 'com.android.library' }
          android {
              namespace 'com.vmecha.vcore'
              compileSdk 34
              defaultConfig {
                  minSdk 21
                  targetSdk 34
                  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.multidex:multidex:2.0.1'
              compileOnly fileTree(dir: 'libs', include: ['*.jar'])
          }
          EOF

      - name: Global Package Rename
        run: |
          find . -type f -not -path '*/.*' -exec sed -i 's/com\.lody\.virtual/com.vmecha.vcore/g' {} +

      - name: Build AAR
        run: |
          chmod +x gradlew
          ./gradlew :lib:assembleRelease --stacktrace --no-daemon

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: vmecha-vcore-release
          path: lib/build/outputs/aar/lib-release.aar
